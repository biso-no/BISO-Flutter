name: Build and Deploy Biso App

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]  # Also trigger on version tags
  pull_request:
    branches: [ main ]

env:
  FLUTTER_VERSION: '3.47.2'  # Match the local toolchain; dependencies need Dart >= 3.10

jobs:
  build-and-deploy-android:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      build_number: ${{ steps.version.outputs.build_number }}
    
    steps:
    - uses: actions/checkout@v4

    # pubspec.yaml's `version:` is the single source of truth for the release version
    - name: Read version from pubspec.yaml
      id: version
      run: |
        version_line=$(grep '^version:' pubspec.yaml | head -n 1 | sed 's/^version:[[:space:]]*//' | tr -d '[:space:]')
        if ! echo "$version_line" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$'; then
          echo "pubspec.yaml version '$version_line' must look like 1.2.3+45" >&2
          exit 1
        fi
        echo "app_version=${version_line%%+*}" >> "$GITHUB_OUTPUT"
        echo "build_number=${version_line##*+}" >> "$GITHUB_OUTPUT"

    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Generate launcher icons
      run: dart run flutter_launcher_icons

    - name: Generate localization files
      run: flutter gen-l10n

    - name: Run build_runner
      run: dart run build_runner build --delete-conflicting-outputs

    - name: Run tests
      run: flutter test
    
    # Decode and setup Android signing
    - name: Setup Android signing
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/keystore.jks
        echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/key.properties
        echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
        echo "storeFile=keystore.jks" >> android/key.properties
    
    - name: Build Android App Bundle (AAB)
      run: flutter build appbundle --release
    
    - name: Build Android APK
      run: flutter build apk --release
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: biso-android-apk-v${{ steps.version.outputs.app_version }}
        path: build/app/outputs/flutter-apk/app-release.apk
    
    # Deploy to Google Play Console
    - name: Deploy to Google Play Console
      uses: r0adkll/upload-google-play@v1.1.3
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: com.biso.no
        releaseFiles: build/app/outputs/bundle/release/app-release.aab
        track: internal  # Options: internal, alpha, beta, production
        status: completed
        changesNotSentForReview: false
        mappingFile: build/app/outputs/mapping/release/mapping.txt
  # Only run tests and builds for PRs (no deployment)
  test-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Generate launcher icons
      run: dart run flutter_launcher_icons

    - name: Generate localization files
      run: flutter gen-l10n

    - name: Run build_runner
      run: dart run build_runner build --delete-conflicting-outputs
    
    - name: Run tests
      run: flutter test
    
    - name: Build Android (test)
      run: flutter build apk --debug
    

  create-github-release:
    needs: [build-and-deploy-android]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write  # Required for creating releases
    
    steps:
    - name: Download Android APK
      uses: actions/download-artifact@v4
      with:
        name: biso-android-apk-v${{ needs.build-and-deploy-android.outputs.app_version }}
    
    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d-%H-%M')" >> $GITHUB_OUTPUT
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: biso-v${{ needs.build-and-deploy-android.outputs.app_version }}-build-${{ steps.date.outputs.date }}
        name: Biso v${{ needs.build-and-deploy-android.outputs.app_version }} - Deployed to Stores
        files: |
          app-release.apk
        body: |
          🚀 **Biso v${{ needs.build-and-deploy-android.outputs.app_version }} deployed to both app stores!**
          
          ## 📱 Store Status
          - ✅ **Google Play Console**: Deployed to internal testing track
          
          ## 📋 Build Info
          - Version: ${{ needs.build-and-deploy-android.outputs.app_version }} (Build ${{ needs.build-and-deploy-android.outputs.build_number }})
          - Flutter: ${{ env.FLUTTER_VERSION }}
          - Commit: ${{ github.sha }}
          - Built: ${{ steps.date.outputs.date }}
          
          ## 📝 Changes
          ${{ github.event.head_commit.message }}
          
          ## 📲 Downloads
          - Android APK attached for direct install/testing
          - App Bundle deployed to Google Play Console
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        

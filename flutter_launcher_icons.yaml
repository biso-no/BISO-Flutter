# dart run flutter_launcher_icons
#
# Sources live in assets/icon/, which is not bundled into the app.
# app_icon.png is assets/logo-dark.png at 60% of the canvas on #001731, the
# same proportions as the BI Student icon. The adaptive foreground is the same
# mark at 40% on a transparent canvas, which keeps it inside Android's 66dp
# safe zone and at about 60% of what the launcher shows.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"

  android: "launcher_icon"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#001731"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 0 # the padding is already in the image

  ios: true
  remove_alpha_ios: true
  background_color_ios: "#001731"

  web:
    generate: true
    image_path: "assets/icon/app_icon.png"

  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 48 # min:48, max:256, default: 48

  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

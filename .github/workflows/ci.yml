name: CI

on:
  pull_request:
  # release.yml runs the same checks before it publishes anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its older run. Runs called from
  # release.yml get a group of their own, so they never cancel each other.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
      - run: flutter analyze
      - run: flutter test

  # The two builds catch native breakage (Gradle, Xcode, plugins) before it
  # reaches main. Releases build both platforms anyway, so they skip these.
  build-android:
    name: Android build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21' # The JDK the Android build (AGP 9.2, Gradle 9.4) is verified with
          cache: gradle
      - uses: ./.github/actions/setup-flutter
      - run: flutter build apk --debug

  build-ios:
    name: iOS build
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
      - run: flutter build ios --debug --no-codesign
